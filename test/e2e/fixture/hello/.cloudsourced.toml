version = 1

[resources]
cpu = 2
memory = "2G"

[environment]
image = "rust:1-slim-bookworm"

[environment.packages]
apt = ["jq", "busybox"]

[environment.toolchains]
rust = "rust-toolchain.toml"

[[environment.setup]]
run = "cp tools.txt /opt/setup-tools.txt"
inputs = ["tools.txt"]

[environment.env]
E2E_IMAGE_ENV = "from-image"

[source]
respect_gitignore = true

[[source.rule]]
paths = ["vendor/**"]
mode = "immutable"

[cache.build]
paths = ["target"]

[cache.deps]
paths = ["$CARGO_HOME/registry", "$CARGO_HOME/git"]

[tool.cargo]
local = ["publish", "login", "install", "new", "init", "add", "remove"]
eager = ["target/debug/hello"]
env   = ["RUSTFLAGS", "CARGO_TERM_*", "RUST_LOG", "RUST_BACKTRACE"]

[tool.sh]
env = ["E2E_*"]

# Dev server ports: the web service (18080 in the machine's network
# namespace) is reachable locally on 18092 while a bash session runs.
[tool.bash]
ports = ["18092:18080"]

[services.web]
image = "busybox:1.37"
command = ["httpd", "-f", "-p", "18080", "-h", "/etc"]
port = 18080

[secrets]
CMD_SECRET = "cmd:printf from-cmd"
FILE_SECRET = "file:.secret"
