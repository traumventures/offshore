name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: prepare
        run: |
          ls -l /dev/fuse
          sudo modprobe fuse || true
          docker pull -q rust:1-slim-bookworm
          docker pull -q busybox:1.37
      - name: end-to-end (local-docker)
        run: ./test/e2e/run.sh
