# Pool configuration with a warm pool for the sample simulations (cloudsourced sim -config).
# Sizes and on-demand prices of AWS c7a instances (us-east-1).
[pool]
id = "sim"
max_machines = 16
min_machines = 0
idle_stop = "20m"
max_lifetime = "24h"

[providers.aws]
type = "aws-ec2"

[scheduler]
cpu_overcommit = 2
memory_overcommit = 1
estimator = "static"

[[scheduler.warm_pool]]
days = ["mon", "tue", "wed", "thu", "fri"]
from = "08:00"
to = "19:00"
machines = 1
timezone = "UTC"

[[providers.aws.size]]
name = "c7a.large"
cpu = 2
memory = "4G"
price_per_hour = 0.1027

[[providers.aws.size]]
name = "c7a.xlarge"
cpu = 4
memory = "8G"
price_per_hour = 0.2053

[[providers.aws.size]]
name = "c7a.2xlarge"
cpu = 8
memory = "16G"
price_per_hour = 0.4106

[[providers.aws.size]]
name = "c7a.4xlarge"
cpu = 16
memory = "32G"
price_per_hour = 0.8211

# Scheduled warm pool: one machine per recently used environment during
# working hours, in addition to min_machines.
